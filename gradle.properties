# Project-wide Gradle settings.

# Scala compilation of the immortan/eclair tree is memory hungry. This replaces the
# old `dexOptions { javaMaxHeapSize }`, which AGP 8 removed.
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8

android.useAndroidX=true

# Each library's R class contains only its own resources. Required default under AGP 8.
android.nonTransitiveRClass=true
