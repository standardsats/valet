import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream
import org.gradle.api.tasks.scala.ScalaCompile

plugins {
    alias libs.plugins.androidApplication
    alias libs.plugins.scalaAndroid
}

// The scala-android plugin adds `src/<sourceSet>/scala` to each source set's *java*
// directories and points ScalaCompile at all of them, emptying the Java task. Our
// .scala sources therefore keep living under src/main/java alongside the .java ones,
// exactly as before -- no source tree move is needed.
scala {
    scalaVersion = libs.versions.scala.get()
}

android {
    namespace 'finance.valet'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        applicationId 'finance.valet'
        multiDexEnabled true
        targetSdk 36
        minSdk 21

        versionName '5.1.2'
        vectorDrawables.generatedDensities = []
    }

    buildFeatures {
        // AGP 8 stopped generating BuildConfig by default. WalletApp switches chain on
        // BuildConfig.FLAVOR and SettingsActivity reads VERSION_CODE/VERSION_NAME, so
        // this has to stay on.
        buildConfig true
    }

    flavorDimensions = ['chain']
    productFlavors {
        mainnet {
            dimension 'chain'
            versionCode 111 // odd for mainnet
        }
        tnet4 {
            dimension 'chain'
            applicationIdSuffix '.testnet4'
            versionCode 110 // even for testnets
        }
        tnet3 {
            dimension 'chain'
            applicationIdSuffix '.testnet3'
            versionCode 110
        }
        regtest {
            dimension 'chain'
            applicationIdSuffix '.regtest'
            versionCode 110
        }
    }

    buildTypes {
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
        }
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Scala 2.11.12 cannot emit bytecode above Java 8, so the Java side is pinned
        // to match. See the ScalaCompile toolchain block below.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${variant.applicationId}_${variant.versionCode}.apk"
        }
    }

    packaging {
        resources {
            excludes += ['**/META-INF/**', '**/meta-inf/**']
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
    }
}

// AGP 8.12 requires Gradle to run on a JDK >= 17, but the Scala 2.11.12 compiler
// predates the module system and does not run there. Fork ScalaCompile onto a JDK 11
// toolchain; the build therefore needs both JDKs visible to Gradle's toolchain detection.
tasks.withType(ScalaCompile).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(11)
    }
    // -encoding: FiatRates.scala and friends contain raw non-ASCII string literals,
    // and a JDK 11 compiler JVM derives its default charset from the locale, which is
    // not the same on every build machine. Pin it.
    scalaCompileOptions.additionalParameters = [
            '-target:jvm-1.8', '-encoding', 'UTF-8', '-Ymacro-global-fresh-names']
    // scalac numbers macro-generated symbols (quicklens' fresh$macro$N) in the order
    // compilation units reach it, and a file tree's iteration order follows the
    // filesystem -- so identical sources produced a different classes3.dex on
    // F-Droid's builder than on the release machine (109 failure). Sort the sources
    // to pin the numbering. The closure keeps resolution lazy: source.files at
    // configuration time would miss generated sources such as BuildConfig.
    def originalSource = source
    source = { originalSource.files.sort { it.path } }
}

dependencies {
    // Android-specific
    implementation libs.multidex
    implementation libs.work.runtime
    implementation libs.appcompat
    implementation libs.currencyedittext
    implementation libs.material
    implementation libs.ndeftools
    implementation libs.applock

    implementation(libs.zxing.android.embedded) {
        // We use zxing sources with fixed List.sort which is not in API21
        exclude group: 'com.google.zxing', module: 'core'
    }

    // Immortan
    implementation libs.scala.library
    implementation libs.secp256k1.kmp.jni.android
    implementation libs.scala.parser.combinators
    implementation libs.quicklens
    implementation libs.akka.actor
    implementation libs.scodec.core
    implementation libs.rxscala

    implementation libs.json4s.native
    implementation libs.spray.json

    implementation libs.bcprov
    implementation libs.guava
    implementation libs.commons.codec
    implementation libs.netty.all

    // Built-in Tor
    implementation libs.okhttp
    implementation libs.tor.android
    implementation libs.jtorctl

    // Android tests
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.espresso.core
}

tasks.withType(Jar).configureEach {
    doLast {
        manifest.attributes['Built-By'] = 'deterministic-build'
        manifest.attributes['Build-Date'] = '1970-01-01T00:00:00Z'
    }
}

tasks.withType(Jar).configureEach {
    outputs.upToDateWhen { false }
    from { files.sort() }
}

android.applicationVariants.all { variant ->
    if (variant.buildType.name != 'release') return

    def variantName = variant.name.capitalize()
    def buildToolsDir = "${android.sdkDirectory}/build-tools/${android.buildToolsVersion}"
    def apkProvider = { variant.outputs.first().outputFile }

    def normalizeTask = tasks.create("normalize${variantName}ApkTimestamps") {
        doLast {
            def sourceDateEpoch = System.getenv('SOURCE_DATE_EPOCH')?.toLong() ?: 0
            def apkFile = apkProvider()
            def tempFile = file("${apkFile}.tmp")

            new ZipOutputStream(new FileOutputStream(tempFile)).withCloseable { zos ->
                new ZipFile(apkFile).withCloseable { zip ->
                    zip.entries().each { srcEntry ->
                        def newEntry = new ZipEntry(srcEntry.name)
                        newEntry.time = sourceDateEpoch * 1000
                        // Android R+ requires resources.arsc (and uncompressed .so when
                        // extractNativeLibs=false) to stay STORED. Alignment is handled by zipalign.
                        newEntry.method = srcEntry.method
                        if (srcEntry.method == ZipEntry.STORED) {
                            newEntry.size = srcEntry.size
                            newEntry.compressedSize = srcEntry.compressedSize
                            newEntry.crc = srcEntry.crc
                        }
                        zos.putNextEntry(newEntry)
                        if (!srcEntry.isDirectory()) {
                            zos.write(zip.getInputStream(srcEntry).bytes)
                        }
                        zos.closeEntry()
                    }
                }
            }

            apkFile.delete()
            tempFile.renameTo(apkFile)
        }
    }

    def zipalignTask = tasks.create("zipalign${variantName}Apk", Exec) {
        dependsOn normalizeTask
        doFirst {
            def apkFile = apkProvider()
            def alignedFile = file("${apkFile}.aligned")
            commandLine "${buildToolsDir}/zipalign", '-f', '-p', '4', apkFile.absolutePath, alignedFile.absolutePath
        }
        doLast {
            def apkFile = apkProvider()
            def alignedFile = file("${apkFile}.aligned")
            apkFile.delete()
            alignedFile.renameTo(apkFile)
        }
    }

    def signTask = tasks.create("sign${variantName}Apk", Exec) {
        dependsOn zipalignTask
        onlyIf { System.getenv("SIGNING_KEY_ALIAS") != null }
        doFirst {
            commandLine "${buildToolsDir}/apksigner", 'sign',
                    '--alignment-preserved', 'true',
                    '--ks', System.getenv("SIGNING_STORE_FILENAME") ?: '',
                    '--ks-key-alias', System.getenv("SIGNING_KEY_ALIAS") ?: '',
                    '--ks-pass', "pass:${System.getenv('SIGNING_STORE_PASSWORD') ?: ''}",
                    // Falls back to the store password, which is the common case and what
                    // the README documents; SIGNING_KEY_PASSWORD covers a differing key password.
                    '--key-pass', "pass:${System.getenv('SIGNING_KEY_PASSWORD') ?: System.getenv('SIGNING_STORE_PASSWORD') ?: ''}",
                    '--v1-signing-enabled', 'true',
                    '--v2-signing-enabled', 'true',
                    apkProvider().absolutePath
        }
    }

    def pgpSignTask = tasks.create("pgpSign${variantName}Apk", Exec) {
        dependsOn signTask
        onlyIf { System.getenv("SIGNING_KEY_ALIAS") != null &&
                System.getenv("PGP_SIGNING_KEY_ID") != null }
        doFirst {
            commandLine 'gpg',
                    '--batch', '--yes',
                    '--local-user', System.getenv("PGP_SIGNING_KEY_ID"),
                    '--passphrase', System.getenv("PGP_SIGNING_PASSWORD") ?: '',
                    '--pinentry-mode', 'loopback',
                    '--armor',
                    '--detach-sign',
                    '--output', "${apkProvider().absolutePath}.asc",
                    apkProvider().absolutePath
        }
    }

    variant.assembleProvider.configure { finalizedBy(signTask, pgpSignTask) }
}
