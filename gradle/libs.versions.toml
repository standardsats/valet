[versions]
# Build toolchain.
# scalaAndroid 25.x is the AGP 8.x line; 26.x targets AGP 9.0+. Keep these in step.
agp = "8.12.3"
scalaAndroid = "25.0417.2204"
scala = "2.11.12"

# Android / UI. Deliberately left at their pre-migration versions so this change is
# a toolchain migration only -- bumping appcompat/material/work has runtime theming
# and behaviour consequences that need device testing, not a build change.
multidex = "2.0.1"
workRuntime = "2.7.1"
appcompat = "1.3.1"
material = "1.4.0"
currencyedittext = "0.0.10"
zxingAndroidEmbedded = "4.2.0"
ndeftools = "1.2.4"
applock = "3.0.2"

# Immortan / Lightning stack
secp256k1KmpJniAndroid = "0.19.0"
scalaParserCombinators = "2.1.0"
quicklens = "1.7.5"
akkaActor = "2.3.14"
scodecCore = "1.11.4"
rxscala = "0.27.0"
json4sNative = "3.6.7"
sprayJson = "1.3.6"

# Crypto / networking
bouncycastle = "1.68"
guava = "33.5.0-android"
commonsCodec = "1.10"
netty = "4.1.42.Final"
okhttp = "4.9.0"
torAndroid = "0.4.6.9"
jtorctl = "0.4.5.7"

# Test
junit = "4.12"
androidxJunit = "1.1.3"
espresso = "3.4.0"

[libraries]
multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "workRuntime" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
currencyedittext = { module = "com.cottacush:CurrencyEditText", version.ref = "currencyedittext" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingAndroidEmbedded" }
ndeftools = { module = "com.google.code.ndef-tools-for-android:ndeftools", version.ref = "ndeftools" }
applock = { module = "com.guardanis:applock", version.ref = "applock" }

scala-library = { module = "org.scala-lang:scala-library", version.ref = "scala" }
secp256k1-kmp-jni-android = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-android", version.ref = "secp256k1KmpJniAndroid" }
scala-parser-combinators = { module = "org.scala-lang.modules:scala-parser-combinators_2.11", version.ref = "scalaParserCombinators" }
quicklens = { module = "com.softwaremill.quicklens:quicklens_2.11", version.ref = "quicklens" }
akka-actor = { module = "com.typesafe.akka:akka-actor_2.11", version.ref = "akkaActor" }
scodec-core = { module = "org.scodec:scodec-core_2.11", version.ref = "scodecCore" }
rxscala = { module = "io.reactivex:rxscala_2.11", version.ref = "rxscala" }
json4s-native = { module = "org.json4s:json4s-native_2.11", version.ref = "json4sNative" }
spray-json = { module = "io.spray:spray-json_2.11", version.ref = "sprayJson" }

bcprov = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bouncycastle" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commonsCodec" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
tor-android = { module = "info.guardianproject:tor-android", version.ref = "torAndroid" }
jtorctl = { module = "info.guardianproject:jtorctl", version.ref = "jtorctl" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
scalaAndroid = { id = "com.soundcorset.scala-android", version.ref = "scalaAndroid" }
