name: build dev apk
on:
  workflow_dispatch:
jobs:
  build-gradle-project:
    runs-on: ubuntu-latest
    steps:
    - name: checkout project sources
      uses: actions/checkout@v3
      with:
        lfs: true
    # 17 runs Gradle/AGP and becomes JAVA_HOME (last listed wins); 11 is kept for the
    # forked Scala 2.11 compiler and located via org.gradle.java.installations.fromEnv.
    - name: Set up JDKs
      uses: actions/setup-java@v4
      with:
        java-version: |
          11
          17
        distribution: 'temurin'
    - name: setup gradle
      uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew assembleDebug -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64
    - uses: actions/upload-artifact@v3
      with:
        path: app/build/outputs/apk/debug/*.apk
        name: valet.apk
