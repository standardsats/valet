name: Build Release APK

on:
  workflow_dispatch:
  #push:
  #  tags:
  #    - '*.*.*'
      
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 21 runs Gradle/AGP and becomes JAVA_HOME (last listed wins); 11 is kept for the
      # forked Scala 2.11 compiler and located via org.gradle.java.installations.fromEnv.
      # 21 rather than 17 to match F-Droid's trixie builder, which has no openjdk-17 --
      # a JDK split between the two sides changes deflate output. See REPRODUCIBLE_BUILDS.md.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            11
            21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # apksigcopier is the tool fdroidserver uses to transplant our signature onto its own
      # rebuild. It reconstructs the v1 signature entries with Python's zipfile, and Python 3.13
      # changed zipfile to drop the UTF-8 general-purpose flag that apksigner sets on those
      # entries -- under 3.13 the check fails on APKs that are perfectly fine. Pin 3.12, which is
      # what F-Droid's buildserver runs. See REPRODUCIBLE_BUILDS.md.
      - name: Set up apksigcopier
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install apksigcopier==1.1.1

      # A silently-empty keystore surfaces as an unreadable ASN.1 error inside apksigner
      # ("Tag number over 30 is not supported"), so validate here where the message can
      # say what actually went wrong.
      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::secret SIGNING_KEYSTORE_BASE64 is empty or not set"
            exit 1
          fi
          # tr strips any line wrapping or CRLF the secret picked up when it was pasted.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > keystore.jks
          bytes=$(stat -c%s keystore.jks)
          echo "decoded keystore: $bytes bytes"
          if [ "$bytes" -lt 100 ]; then
            echo "::error::decoded keystore is $bytes bytes -- the secret is not valid base64 of a keystore"
            exit 1
          fi
          keytool -list -keystore keystore.jks -storepass "$SIGNING_STORE_PASSWORD" >/dev/null
          echo "keystore loads OK"

      # This job publishes the APK that F-Droid diffs its own rebuild against, so the
      # epoch has to be derived exactly the way fdroidserver derives it -- from the
      # commit timestamp. Without this, normalizeReleaseApkTimestamps falls back to 0
      # and the published APK can never reproduce. See REPRODUCIBLE_BUILDS.md.
      - name: Build release APK
        shell: bash
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_FILENAME: ${{ github.workspace }}/keystore.jks
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          TZ: UTC
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH ($(date -u -d "@$SOURCE_DATE_EPOCH"))"
          ./gradlew assembleRelease -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64

      # gradle's verify<Variant>Apk already asserts that signing did not touch the entry region.
      # This runs the real thing on top: exactly the apksigcopier + apksigner round trip
      # fdroidserver performs when it compares its rebuild to the APK published here. If this
      # passes, F-Droid's verification of this release passes too.
      - name: Verify the signature transplants onto an unsigned rebuild
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner" || { echo "::error::build-tools 36.0.0 apksigner not found"; exit 1; }
          for signed in $(find app/build/outputs/apk -path '*/release/*.apk'); do
            unsigned="$signed.unsigned"
            test -f "$unsigned" || { echo "::error::missing $unsigned"; exit 1; }
            echo "== $(basename "$signed")"
            apksigcopier copy "$signed" "$unsigned" /tmp/transplanted.apk
            "$apksigner" verify --verbose /tmp/transplanted.apk > /dev/null
            echo "   signature verifies against the unsigned build"
            rm -f /tmp/transplanted.apk
          done

      # Every flavour's release APK, under the name build.gradle already gives it
      # (<applicationId>_<versionCode>.apk), so nothing here has to track versionCode
      # bumps or the flavour list. Fails loudly rather than publishing an empty release.
      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -path '*/release/*.apk' -exec cp {} out/ \;
          count=$(ls -1 out/*.apk 2>/dev/null | wc -l)
          echo "collected $count apk(s):"
          ls -1 out/
          test "$count" -gt 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
