name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'
      
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 17 runs Gradle/AGP and becomes JAVA_HOME (last listed wins); 11 is kept for the
      # forked Scala 2.11 compiler and located via org.gradle.java.installations.fromEnv.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            11
            17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_FILENAME: ${{ github.workspace }}/keystore.jks
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64

      # Every flavour's release APK, under the name build.gradle already gives it
      # (<applicationId>_<versionCode>.apk), so nothing here has to track versionCode
      # bumps or the flavour list. Fails loudly rather than publishing an empty release.
      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -path '*/release/*.apk' -exec cp {} out/ \;
          count=$(ls -1 out/*.apk 2>/dev/null | wc -l)
          echo "collected $count apk(s):"
          ls -1 out/
          test "$count" -gt 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
